openapi: 3.0.3

info:
  title: API Cursos Universitarios
  description: API para administrar cursos universitarios
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Servidor local

paths:
  /api/cursos:
    get:
      summary: Consultar todos los cursos
      responses:
        '200':
          description: Lista de cursos obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Curso'

    post:
      summary: Crear un nuevo curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
      responses:
        '201':
          description: Curso creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '400':
          description: Datos inválidos para crear el curso
  
  /api/cursos/codigo/{codigo}:
    get:
      summary: Consultar curso por codigo
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Curso encontrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '404':
          description: Curso no encontrado

  /api/cursos/{id}:
    put:
      summary: Actualizar un curso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
      responses:
        '200':
          description: Curso actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '400':
          description: Datos inválidos para actualizar el curso
        '404':
          description: Curso no encontrado

    delete:
      summary: Eliminar un curso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Curso eliminado correctamente
        '404':
          description: Curso no encontrado

components:
  schemas:
    CursoRequest:
      type: object
      required:
        - nombre
        - codigo
        - creditos
        - estado
      properties:
        nombre:
          type: string
        codigo:
          type: string
        creditos:
          type: integer
        estado:
          type: string

    Curso:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        codigo:
          type: string
        creditos:
          type: integer
        estado:
          type: string