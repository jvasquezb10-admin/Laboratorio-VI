openapi: 3.0.3

info:
  title: API Reservas de Hotel
  description: API para administrar reservas de un hotel
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Servidor local

paths:
  /api/reservas:
    get:
      summary: Consultar todas las reservas
      responses:
        '200':
          description: Lista de reservas obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reserva'

    post:
      summary: Crear una nueva reserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaRequest'
      responses:
        '201':
          description: Reserva creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          description: Datos inválidos para crear la reserva

  /api/reservas/{id}:
    get:
      summary: Consultar reserva por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Reserva encontrada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '404':
          description: Reserva no encontrada
    put:
      summary: Actualizar una reserva
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaRequest'
      responses:
        '200':
          description: Reserva actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          description: Datos inválidos para actualizar la reserva
        '404':
          description: Reserva no encontrada
  /api/reservas/{id}/cancelacion:
    patch:
      summary: Cancelar una reserva
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Reserva cancelada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '404':
          description: Reserva no encontrada
components:
  schemas:
    ReservaRequest:
      type: object
      required:
        - nombreCliente
        - habitacion
        - fechaEntrada
        - fechaSalida
        - estado
      properties:
        nombreCliente:
          type: string
        habitacion:
          type: string
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        estado:
          type: string

    Reserva:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombreCliente:
          type: string
        habitacion:
          type: string
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        estado:
          type: string